name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats — Zafarkhan06
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Zafarkhan06&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats-zafarkhan06.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top langs — Zafarkhan06
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Zafarkhan06&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs-zafarkhan06.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats — Mediknocx
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Mediknocx&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats-mediknocx.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats — contact769
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=contact769&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats-contact769.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
